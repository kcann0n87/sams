[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sams-automation"
version = "0.1.0"
description = "Automate registering Sam's Club complimentary secondary members."
requires-python = ">=3.9"
dependencies = [
    "playwright>=1.44",
    "PyYAML>=6.0",
    "Flask>=3.0",
]

[project.scripts]
sams-automation = "sams_automation.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
